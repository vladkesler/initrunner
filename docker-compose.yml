# InitRunner — Docker Compose
#
# Run:            docker compose up
# Build locally:  docker compose up --build
#
# Do not commit .env files with real API keys.
# Use `docker compose --env-file` or a secret manager for production.

services:
  initrunner:
    # Published image (default)
    image: ghcr.io/vladkesler/initrunner:latest
    # Or from Docker Hub: vladkesler/initrunner:latest
    # Uncomment to build from source instead:
    # build: .
    ports:
      - "8100:8100"
    volumes:
      # Mount custom roles here to override seeded examples:
      # - ./roles:/data/roles
      # Uncomment to enable Docker sandbox (security.docker.enabled: true).
      # WARNING: This gives the container full control over the host Docker daemon.
      # - /var/run/docker.sock:/var/run/docker.sock
      - initrunner-data:/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - INITRUNNER_DASHBOARD_API_KEY=${INITRUNNER_DASHBOARD_API_KEY:-}
    # Sized for the default command below: the dashboard measures ~168 MiB
    # here, so 256m leaves roughly a third free. Raise it to 512m for any role
    # with `ingest:` or vector `memory:` -- LanceDB loads when the store opens
    # and that alone measures ~212 MiB idle, which is too close to this cap to
    # survive an ingestion run. See docs/operations/memory-footprint.md.
    mem_limit: 256m
    restart: unless-stopped
    # Default CMD from image launches the dashboard.
    # Override examples (raise mem_limit to 512m for the RAG one):
    #   API server:    command: ["initrunner", "run", "/data/roles/my-agent.yaml", "--serve", "--host", "0.0.0.0"]
    #   RAG agent:     command: ["initrunner", "run", "/data/roles/rag-agent.yaml", "--serve", "--host", "0.0.0.0"]
    #   Telegram bot:  command: ["initrunner", "run", "--bot", "telegram"]
    #   Interactive:   command: ["initrunner", "run", "-i"]

volumes:
  initrunner-data:
