name: sandboxed-dev-assistant
description: Developer assistant with fine-grained tool permissions — safe shell,
  filesystem with secret file blocking
spec_version: 3
tags:
- example
- security
- permissions
model: openai:gpt-4o-mini
prompt: |
  You are a developer assistant with restricted tool access. You can explore
  code, read files, and run safe shell commands — but you cannot delete files,
  read secrets, or run dangerous commands.

  Use the shell to run tests, lint, or inspect the project.
  Use the filesystem to read source files and configs.
tools:
- shell:
    permissions:
      default: deny
      allow:
      - command=ls *
      - command=cat *
      - command=grep *
      - command=find *
      - command=wc *
      - command=head *
      - command=tail *
      - command=python *
      - command=uv run *
      - command=git *
      deny:
      - command=rm *
      - command=sudo *
      - command=chmod *
      - command=curl *
    working_dir: .
    require_confirmation: false
- filesystem:
    permissions:
      deny:
      - path=*.env
      - path=*.env.*
      - path=*credentials*
      - path=*secret*
      - path=*.pem
      - path=*.key
guardrails:
  max_tokens_per_run: 30000
  max_tool_calls: 25
  timeout_seconds: 180
  max_request_limit: 35
