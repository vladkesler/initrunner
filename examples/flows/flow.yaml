name: email-pipeline
description: Multi-agent email processing pipeline
spec_version: 3
guardrails:
  max_request_limit: 30
agents:
  inbox-watcher:
    use: roles/inbox-watcher.yaml
    then:
      to: triager
  triager:
    use: roles/triager.yaml
    then:
      to:
      - researcher
      - responder
      circuit_breaker_threshold: 5
    after:
    - inbox-watcher
  researcher:
    use: roles/researcher.yaml
    after:
    - triager
  responder:
    use: roles/responder.yaml
    after:
    - triager
