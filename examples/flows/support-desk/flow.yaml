name: support-desk
description: |
  Support desk pipeline with intelligent auto-routing. An intake agent summarizes incoming requests, then sense routing automatically sends each request to the right handler -- researcher for technical issues, responder for quick answers, or escalator for urgent/complex cases. No static fan-out: each message goes to exactly one target.
spec_version: 3
guardrails:
  max_request_limit: 30
agents:
  intake:
    use: roles/intake.yaml
    then:
      to:
      - researcher
      - responder
      - escalator
      strategy: sense
  researcher:
    use: roles/researcher.yaml
    after:
    - intake
  responder:
    use: roles/responder.yaml
    after:
    - intake
  escalator:
    use: roles/escalator.yaml
    after:
    - intake
