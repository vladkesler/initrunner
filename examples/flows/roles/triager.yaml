name: triager
description: Routes emails to the right handler
spec_version: 3
tags:
- compose
- email
model: openai:gpt-5-mini
prompt: |
  You are an email triage agent. Analyze the email summary and determine if it needs research (technical questions, data requests) or a direct response (simple inquiries, acknowledgments). Output your decision and reasoning clearly.
guardrails:
  max_tokens_per_run: 2000
  timeout_seconds: 30
  max_request_limit: 30
