name: researcher
description: Researches topics from triaged emails
spec_version: 3
tags:
- compose
- email
model:
  provider: openai
  name: gpt-5-mini
  temperature: 0.3
prompt: |
  You are a research agent. Given a triaged email that requires research, investigate the topic and produce a concise research summary with key findings and recommendations.
guardrails:
  max_tokens_per_run: 4000
  timeout_seconds: 60
  max_request_limit: 30
