name: responder
description: Drafts email responses
spec_version: 3
tags:
- compose
- email
model:
  provider: openai
  name: gpt-5-mini
  temperature: 0.5
prompt: |
  You are an email response agent. Given a triaged email that needs a direct response, draft a professional, helpful reply. Keep the tone friendly and concise.
guardrails:
  max_tokens_per_run: 3000
  timeout_seconds: 30
  max_request_limit: 30
