name: inbox-watcher
description: Monitors inbox and forwards new messages
spec_version: 3
tags:
- compose
- email
model: openai:gpt-5-mini
prompt: |
  You are an inbox monitor. When triggered, summarize the incoming email content and forward it for triage. Output a concise summary including sender, subject, and key points.
triggers:
- type: cron
  schedule: '*/5 * * * *'
  prompt: Check for new emails and summarize any unread messages.
guardrails:
  max_tokens_per_run: 2000
  timeout_seconds: 30
  max_request_limit: 30
