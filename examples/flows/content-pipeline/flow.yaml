name: content-pipeline
description: |
  Multi-agent content creation pipeline. A file watcher monitors ./drafts/ for new markdown or text files, extracts the topic, and delegates to a researcher. The researcher fans out to a writer (polished output) and a reviewer (QA checks). Memory is enabled for researcher and writer so they build up knowledge across runs.
spec_version: 3
guardrails:
  max_request_limit: 30
agents:
  content-watcher:
    use: roles/content-watcher.yaml
    then:
      to: researcher
  researcher:
    use: roles/researcher.yaml
    then:
      to:
      - writer
      - reviewer
    after:
    - content-watcher
  writer:
    use: roles/writer.yaml
    after:
    - researcher
  reviewer:
    use: roles/reviewer.yaml
    after:
    - researcher
shared_memory:
  enabled: true
  store_path: ./.initrunner/content-shared.db
  max_memories: 2000
