name: test-pipeline
description: |
  Multi-agent test pipeline. A file watcher detects repository changes, analyzes git diff to determine affected modules, and delegates to unit and integration test runners. Each runner posts its own results directly to Slack.
spec_version: 3
guardrails:
  max_request_limit: 30
agents:
  change-detector:
    use: roles/change-detector.yaml
    then:
      to:
      - unit-runner
      - integration-runner
  unit-runner:
    use: roles/unit-runner.yaml
    after:
    - change-detector
  integration-runner:
    use: roles/integration-runner.yaml
    after:
    - change-detector
shared_memory:
  enabled: true
  store_path: ./.initrunner/test-pipeline-shared.db
