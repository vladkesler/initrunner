name: debate
description: Multi-round debate on technical decisions with opposing viewpoints
spec_version: 3
tags:
- debate
- decision-making
- architecture
model: openai:gpt-5-mini
guardrails:
  timeout_seconds: 120
  max_request_limit: 30
  team_token_budget: 300000
  team_timeout_seconds: 600
agents:
  optimist: argue for why the proposed approach will succeed, citing benefits and
    opportunities
  skeptic: find flaws, risks, failure modes, and hidden costs in the proposal
  pragmatist: evaluate trade-offs, propose practical compromises, and recommend the
    path forward
run: debate
debate:
  max_rounds: 2
