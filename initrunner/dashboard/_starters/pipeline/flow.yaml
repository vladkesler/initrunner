name: pipeline
description: |
  CI event processing pipeline. A webhook receiver accepts CI webhooks, a build analyzer diagnoses failures, and a notifier sends Slack alerts and updates GitHub commit status.
spec_version: 3
guardrails:
  max_request_limit: 30
agents:
  webhook-receiver:
    use: roles/webhook-receiver.yaml
    then:
      to: build-analyzer
  build-analyzer:
    use: roles/build-analyzer.yaml
    then:
      to: notifier
    after:
    - webhook-receiver
  notifier:
    use: roles/notifier.yaml
    after:
    - build-analyzer
