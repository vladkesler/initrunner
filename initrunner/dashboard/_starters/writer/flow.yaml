name: writer
description: |
  Topic researcher, content writer, and editor/fact-checker pipeline. Submit topics via webhook or let the daily cron pick from a topic queue. Outputs polished markdown articles with verified citations.
spec_version: 3
guardrails:
  max_request_limit: 30
agents:
  researcher:
    use: roles/researcher.yaml
    then:
      to: writer
  writer:
    use: roles/writer.yaml
    then:
      to: editor
    after:
    - researcher
  editor:
    use: roles/editor.yaml
    after:
    - writer
shared_memory:
  enabled: true
