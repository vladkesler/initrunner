name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --dev --extra dashboard --extra a2a --extra mcp --extra vector
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check initrunner/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev --extra dashboard --extra a2a --extra mcp --extra vector
      - run: uv run pytest tests/ -v

  # A core install must stay lean: no MCP stack, no vector store. These two
  # files are the contract, and they only mean anything in an environment
  # where the extras are genuinely absent.
  test-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run pytest tests/test_core_footprint.py tests/test_lean_extras.py -v
